<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats - GonowBus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-solid fa-bus"></i> GonowBus</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div id="busInfoHeader">
                        <!-- Info filled by JS -->
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 text-center">
                    <div class="card-body">
                        <div class="seat-legend">
                            <div class="legend-item"><div class="legend-box" style="background:#fff"></div> Available</div>
                            <div class="legend-item"><div class="legend-box" style="background:#4CAF50; border-color:#4CAF50"></div> Selected</div>
                            <div class="legend-item"><div class="legend-box" style="background:#FFC107; border-color:#FFC107"></div> Held</div>
                            <div class="legend-item"><div class="legend-box" style="background:#9E9E9E; border-color:#9E9E9E"></div> Booked</div>
                        </div>

                        <div class="d-flex justify-content-center p-4 bg-light rounded-4">
                            <div class="seat-container">
                                <!-- Steering Wheel Indicator -->
                                <div class="text-end mb-4"><i class="fa-solid fa-steering-wheel fs-3 text-muted"></i></div>
                                
                                <div id="seatGrid">
                                    <!-- Seats dynamic -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 sticky-top" style="top: 20px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Trip Details</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Selected Seats</span>
                            <span class="fw-bold" id="selectedSeats">-</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Price per Seat</span>
                            <span class="fw-bold" id="seatPrice">-</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 fw-bold">Total</span>
                            <span class="fs-5 fw-bold text-primary-theme" id="totalAmount">₹0</span>
                        </div>
                        
                        <button id="proceedToBookBtn" class="btn btn-primary-theme w-100 btn-lg fw-bold" disabled>CONTINUE BOOKING</button>
                        
                        <div class="mt-3 text-center text-muted small">
                            <i class="fa-solid fa-clock"></i> Seats are auto-released if not booked within 5 minutes.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="app.js"></script>
</body>
</html>
